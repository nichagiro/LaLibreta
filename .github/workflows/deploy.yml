name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente a la vez para evitar colisiones
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Linting
        run: npm run lint

      - name: Run test suite
        run: npm run test

      - name: Build static SPA
        run: npm run build
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'sheets' }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_APP_AUTH_TOKEN: ${{ secrets.VITE_APP_AUTH_TOKEN }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE || 'Control de Ingresos' }}
          VITE_DEFAULT_CURRENCY: ${{ vars.VITE_DEFAULT_CURRENCY || 'COP' }}
          VITE_TIMEZONE: ${{ vars.VITE_TIMEZONE || 'America/Bogota' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
